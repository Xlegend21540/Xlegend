name: Build Web App to Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies and Build Web Project
        run: |
          npm install
          # Creates the static deployment folder (usually 'dist' or 'build')
          npm run build --if-present

      - name: Inject Mobile Wrapper (Capacitor)
        run: |
          # Detect build folder dynamically, fallback to root if missing
          BUILD_DIR="dist"
          if [ ! -d "dist" ] && [ -d "build" ]; then BUILD_DIR="build"; fi
          if [ ! -d "dist" ] && [ ! -d "build" ]; then mkdir dist && cp index.html dist/ 2>/dev/null || true; fi
          
          # Initialize Android platform layer
          npm install @capacitor/core @capacitor/cli
          npx cap init "GoogleAIStudioApp" "com.aistudio.app" --web-dir=$BUILD_DIR
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compile to APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compiled-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
