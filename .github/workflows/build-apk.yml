name: Compile Web App to Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Flat Application Bundle
        run: |
          # Bundles your AI Studio web export files safely without node installation loops
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/.github

      - name: Inject Mobile App Wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
          npx cap init "MyAIStudioApp" "com.aistudio.app" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compile to Production APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
