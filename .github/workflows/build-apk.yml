name: Build Android APK - Legend File

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile & Package Installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21 (Required for AGP 8.13+ & Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Capacitor Android platform..."
            npx cap add android
          else
            echo "Syncing existing Android platform..."
          fi
          npx cap sync android

      - name: Ensure Android Permissions in Manifest
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (!fs.existsSync(manifestPath)) {
              console.log("Manifest not found at " + manifestPath);
              process.exit(0);
            }
            let xml = fs.readFileSync(manifestPath, "utf8");
            
            // 1. Ensure tools namespace exists
            if (!xml.includes("xmlns:tools=")) {
              xml = xml.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"");
            }
            
            // 2. Ensure requestLegacyExternalStorage on <application>
            if (!xml.includes("android:requestLegacyExternalStorage")) {
              xml = xml.replace("<application", "<application android:requestLegacyExternalStorage=\"true\"");
            }
            
            // 3. Ensure full file manager permissions exist
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" tools:ignore=\"ScopedStorage\" />",
              "<uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" tools:ignore=\"ScopedStorage\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />"
            ];
            
            perms.forEach(perm => {
              const nameMatch = perm.match(/android:name="([^"]+)"/);
              if (nameMatch && !xml.includes(nameMatch[1])) {
                xml = xml.replace("</manifest>", "    " + perm + "\n</manifest>");
              }
            });
            
            fs.writeFileSync(manifestPath, xml, "utf8");
            console.log("AndroidManifest.xml verified with all file manager permissions.");
          '

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK for Upload
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" output-apk/LegendFile-v1.0.0-debug.apk
            ls -lh output-apk/LegendFile-v1.0.0-debug.apk
          else
            echo "ERROR: APK file not found!"
            find android/app/build/outputs/ -type f || true
            exit 1
          fi

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendFile-Android-APK
          path: output-apk/LegendFile-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
